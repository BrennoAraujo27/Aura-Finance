name: Compilar APK Aura Finance

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configurar plataforma Android limpa
        working-directory: ./aura_finance_mobile
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.aurafinance

          # Ajusta minSdk para 21 (necessário para webview_flutter)
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +

          # Desabilita lintVital via Python (evita crash do Kotlin Lint no webview_flutter_android)
          python3 -c "
          import os, glob
          lint_block_groovy = '\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }'
          lint_block_kts = '\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }'
          for f in glob.glob('android/**/*.gradle', recursive=True) + glob.glob('android/**/*.gradle.kts', recursive=True):
              content = open(f).read()
              if 'android {' in content and 'lintOptions' not in content and 'lint {' not in content:
                  block = lint_block_kts if f.endswith('.kts') else lint_block_groovy
                  content = content.replace('android {', 'android {' + block, 1)
                  open(f, 'w').write(content)
                  print(f'Patched lint in: {f}')
          "

          # Permissão de Internet (obrigatória para o WebView carregar o app)
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependencias do Flutter
        working-directory: ./aura_finance_mobile
        run: flutter pub get

      - name: Compilar APK Release
        working-directory: ./aura_finance_mobile
        run: flutter build apk --release --android-skip-build-dependency-validation --no-shrink

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: aura-finance-android-apk
          path: aura_finance_mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar Release Oficial no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: release-latest
          name: Aura Wealth Android (APK Oficial Atualizado)
          body: |
            ## 📱 Aura Wealth Android v2.0 - WebView Edition

            O app mobile agora carrega **exatamente a mesma interface** da versão web:
            - ✅ Visual Aura Wealth idêntico ao web (sem dados fictícios)
            - ✅ Lançamentos manuais com cartões e parcelamento
            - ✅ Simulador FinAI de parcelas
            - ✅ Login real com Supabase
            - ✅ Dados 100% reais, sem demo hardcoded
          files: aura_finance_mobile/build/app/outputs/flutter-apk/app-release.apk
