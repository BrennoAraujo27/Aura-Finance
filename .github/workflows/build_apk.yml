name: Compilar APK Aura Finance

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configurar plataforma Android limpa
        working-directory: ./aura_finance_mobile
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.aurafinance
          
          # Ajusta minSdk para 23 para suportar biometria e armazenamento seguro
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} +
          
          # Insere permissoes no AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependencias do Flutter
        working-directory: ./aura_finance_mobile
        run: flutter pub get

      - name: Compilar APK Release
        working-directory: ./aura_finance_mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: aura-finance-android-apk
          path: aura_finance_mobile/build/app/outputs/flutter-apk/app-release.apk
