name: Deploy Aura Wealth Web

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar App Web no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar arquivos do app web
        uses: actions/upload-pages-artifact@v3
        with:
          # Publica index.html, app.js e styles.css da raiz do repositório
          path: '.'

      - name: Fazer deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
