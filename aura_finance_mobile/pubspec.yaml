name: aura_finance_mobile
description: "Aura Finance - Aplicativo Inteligente de Controle Financeiro Pessoal"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Charts & Visuals
  fl_chart: ^0.68.0

  # Formatting & Localizations
  intl: ^0.19.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
